on:
  push:
    branches: ['*']
    # TODO publish on tags
    # tags: ['v*']

jobs:
  # Set the job key. The key is displayed as the job name when a job name is
  # not provided
  all:
    # Name the job
    name: Run full CI suite
    # https://docs.github.com/en/actions/using-workflows/workflow-syntax-for-github-actions#choosing-github-hosted-runners
    # This is the VM image
    runs-on: ubuntu-latest
    container:
      # updated 2026-11-21
      image: ocaml/opam:ubuntu-26.04-ocaml-5.4
    steps:
      - name: Install OS deps
        shell: bash -euxo pipefail {0}
        run: |
          CLANG_VERSION=21
          CLANG=clang-$CLANG_VERSION
          sudo apt-get update
          sudo apt-get --yes upgrade
          sudo apt-get install --yes \
            autoconf \
            cmake \
            libtool \
            golang \
            libreadline-dev \
            ninja-build \
            9base \
            bear \
            llvm \
            llvm-dev \
            $CLANG
          sudo update-alternatives --install /usr/bin/clang clang "$(which "$CLANG")" 100
      - name: Chmod dirs
        shell: bash -exuo pipefail {0}
        run: |
          sudo chown "$(id -u):$(id -g)" "$GITHUB_WORKSPACE"
          sudo chmod -R 777 "$GITHUB_WORKSPACE"
          sudo chmod -R 777 "$RUNNER_TEMP"
      - name: Download doc-builder [deprecated]
        shell: bash -exuo pipefail {0}
        run: |
          VERSION='0.5'
          ARCH='amd64'
          REMOTE="https://github.com/christopherfujino/doc-builder/releases/download/v${VERSION}/db-${VERSION}-linux-${ARCH}.tar.gz"
          curl -L "$REMOTE" -o db.tar.gz
          tar xvzf db.tar.gz
          mv "./db-${VERSION}-linux-${ARCH}" ./db
      - name: checkout code
        uses: actions/checkout@v7
        with:
          repository: christopherfujino/monorepo
          ref: master
          fetch-depth: 1
          submodules: recursive
      - name: Check out sloth REF
        shell: bash -exuo pipefail {0}
        # TODO: support when GITHUB_REF is a tag (e.g. `refs/tags/v0.1.0`)
        run: |
          REF=$(echo "${GITHUB_REF}" | sed -n 's/refs\/heads\/\(.*\)/\1/p')
          pushd src/sloth
            git submodule init -- .
            sed --in-place=.bak 's/url = git@github\.com:christopherfujino\/slothscript/url = https:\/\/github.com\/christopherfujino\/slothscript/' ../../.git/config
            git submodule update .
            git checkout $REF
          popd
      - name: Setup switch
        shell: bash -exuo pipefail {0}
        run: |
          opam init --bare --disable-sandboxing
          # Latest stable as of 2025-11-06
          opam switch create default-switch 5.4.0
          opam install --yes dune ocamlformat
      - name: Run CI
        shell: bash -exuo pipefail {0}
        run: |
          pushd monorepo/src/sloth
            eval $(opam env --switch=default-switch)
            # 9base install path
            export PATH="$PATH:$(realpath ../../../db):/usr/lib/plan9/bin"
            mk ci
          popd
